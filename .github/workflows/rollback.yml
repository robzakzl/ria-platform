name: Rollback

# Redeploys an earlier commit of `main` to prod (docs/deployment.md, "Roll back"). It runs that commit's
# own scripts/deploy.sh.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on main to redeploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: assume the AWS deploy role (OIDC). contents: write: push the web app to gh-pages.
    permissions:
      id-token: write
      contents: write
    # The same queue as the prod deploy job, so a rollback and a deploy never overlap.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      SHA: ${{ inputs.sha }}
      SUSPENDED: ${{ vars.PROD_SUSPENDED }}
    steps:
      - name: Check the inputs
        run: |
          [[ $GITHUB_REF == refs/heads/main ]] || { echo "Run this workflow from main, not $GITHUB_REF" >&2; exit 1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit SHA" >&2; exit 1; }
          [[ ${SUSPENDED,,} != true ]] ||
            { echo "prod is suspended (variable PROD_SUSPENDED); restart it first (docs/deployment.md)" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # First-parent only: a state main itself was in (a merge CI deployed), never a commit from inside a
      # merged PR branch that was never deployed on its own.
      - name: Check the commit is a state of main, then check it out
        run: |
          git rev-list --first-parent origin/main | grep -qx "$SHA" ||
            { echo "$SHA is not a first-parent commit of main" >&2; exit 1; }
          # An older template has no DbSnapshot: on a stack restored from a suspension snapshot it would
          # replace the database with an empty one.
          git show "$SHA:infra/app.yaml" | grep -q '^  DbSnapshot:' ||
            { echo "$SHA predates suspend/restart support; roll back to a newer commit" >&2; exit 1; }
          git checkout --detach "$SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: us-east-1
      - run: scripts/deploy.sh prod "$SHA"
