<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Asterly is paused</title>
    <!-- Served by GitHub Pages while prod is suspended (scripts/suspend.sh, docs/deployment.md). -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1b1f24;
        --muted: #5b6470;
        --border: #dde1e6;
        --accent: #3b5bdb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --card: #1a1e24;
          --text: #e8eaed;
          --muted: #a2a9b3;
          --border: #2c323a;
          --accent: #8ea4f5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 32px 28px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .badge {
        display: inline-block;
        margin: 0 0 12px;
        padding: 2px 10px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
      p { margin: 0 0 12px; color: var(--muted); }
      p:last-child { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">Paused</p>
      <h1>The Asterly demo is paused</h1>
      <p>The demo has been switched off to save hosting costs. Its data is kept safe.</p>
      <p>It can be turned back on at any time. Please check back later.</p>
    </main>
  </body>
</html>
