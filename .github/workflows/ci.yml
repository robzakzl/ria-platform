name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Restarts a suspended prod (docs/deployment.md, "Suspend and restart"): runs the deploy without a merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The same command a developer and every Jaah runner use: quick checks, build, stack smoke test.
      - run: ./dc check full

  # Every push (merge) to main deploys to prod at once, in parallel with `check`: the deploy does not
  # wait for the gate (an operator decision, docs/deployment.md). PRs run `check` only. No `environment:`
  # key: it would change the OIDC subject the deploy role trusts (docs/deployment.md). While the repo
  # variable PROD_SUSPENDED is "true", prod is suspended and nothing deploys.
  deploy-prod:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && vars.PROD_SUSPENDED != 'true'
    runs-on: ubuntu-latest
    # A restart (workflow_dispatch) also restores the database from its snapshot, which takes 15–25 minutes.
    timeout-minutes: 60
    # id-token: assume the AWS deploy role (OIDC). contents: write: push the web app to gh-pages.
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: us-east-1
      - run: scripts/deploy.sh prod "$GITHUB_SHA"
