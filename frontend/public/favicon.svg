<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 9 104 104">
  <!-- Asterly crest shield (the full logo is frontend/src/Logo.tsx). Ivory in a dark browser theme. -->
  <style>
    .ink { fill: #14254a; }
    .card { fill: #fff; }
    .gold { fill: #b08d4a; stroke: #b08d4a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f4efe3; }
